[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agos"
version = "0.1.0"
description = "Local, workflow-first agent orchestration vertical slice"
requires-python = ">=3.11"

[project.scripts]
agos = "agos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
