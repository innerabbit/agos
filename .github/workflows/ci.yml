name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires Python >=3.11; this MVP is continuously
        # exercised on the maintained 3.11–3.14 releases.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile project sources
        run: python -m compileall -q src tests examples
      - name: Build and install package in an isolated environment
        shell: bash
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --no-deps .
          .ci-venv/bin/agos --help
          output_dir="$(mktemp -d)"
          .ci-venv/bin/agos research-to-publish-demo --dry-run --output-dir "$output_dir"
          test ! -e "$output_dir/local-workflow-demo.md"
